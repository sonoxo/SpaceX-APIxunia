<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SpaceX API XUNIA Mission Intelligence Layer</title>
  <desc id="desc">Animated public-data mission intelligence pipeline from SpaceX API through XUNIA, Glass Onion, VIRGINIA, VA3LM and ZYRA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030711"/><stop offset=".55" stop-color="#071a32"/><stop offset="1" stop-color="#170820"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00eaff"/><stop offset=".5" stop-color="#8a5cff"/><stop offset="1" stop-color="#ffd15c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g opacity=".18" stroke="#2cdfff"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/><path d="M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420M720 0V420M840 0V420M960 0V420M1080 0V420"/></g>
  <text x="600" y="52" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">SPACEX-APIxunia // XUNIA MISSION INTELLIGENCE</text>
  <text x="600" y="82" fill="#8ff6ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">PUBLIC DATA • PROVENANCE • ONTOLOGY • REASON • VERIFY</text>

  <g transform="translate(135 210)" filter="url(#glow)">
    <circle r="72" fill="#07152a" stroke="#00eaff" stroke-width="3"/>
    <circle r="92" fill="none" stroke="#00eaff" stroke-width="2" stroke-dasharray="7 12"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></circle>
    <text y="-8" fill="#fff" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">PUBLIC</text><text y="18" fill="#8ff6ff" text-anchor="middle" font-family="Arial" font-size="15">SpaceX API</text>
  </g>
  <g transform="translate(600 210)" filter="url(#glow)">
    <circle r="84" fill="#0c1028" stroke="url(#flow)" stroke-width="4"/>
    <circle r="108" fill="none" stroke="#8a5cff" stroke-width="2" stroke-dasharray="8 14"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/></circle>
    <text y="-18" fill="#fff" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">XUNIA</text><text y="10" fill="#ffd15c" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">GLASS ONION</text><text y="36" fill="#d9d4ff" text-anchor="middle" font-family="Arial" font-size="14">Mission Ontology</text>
  </g>
  <g transform="translate(1065 210)" filter="url(#glow)">
    <circle r="72" fill="#151023" stroke="#ffd15c" stroke-width="3"/>
    <circle r="92" fill="none" stroke="#ffd15c" stroke-width="2" stroke-dasharray="10 14"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle>
    <text y="-8" fill="#fff" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">VA3LM + ZYRA</text><text y="18" fill="#ffe8a0" text-anchor="middle" font-family="Arial" font-size="14">Verify + Review</text>
  </g>

  <g fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round">
    <path d="M230 210 C330 130 430 130 500 190" stroke-dasharray="18 13"><animate attributeName="stroke-dashoffset" from="0" to="-62" dur="1.7s" repeatCount="indefinite"/></path>
    <path d="M700 190 C790 130 900 130 970 210" stroke-dasharray="18 13"><animate attributeName="stroke-dashoffset" from="0" to="-62" dur="1.9s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#fff" filter="url(#glow)"><circle r="5"><animateMotion dur="2.8s" repeatCount="indefinite" path="M230 210 C330 130 430 130 500 190"/></circle><circle r="5"><animateMotion dur="3.1s" repeatCount="indefinite" path="M700 190 C790 130 900 130 970 210"/></circle></g>

  <g font-family="Arial,sans-serif" font-size="14" font-weight="700">
    <g transform="translate(310 295)"><rect width="150" height="42" rx="12" fill="#08182d" stroke="#00eaff"/><text x="75" y="26" fill="#dffcff" text-anchor="middle">PROVENANCE</text></g>
    <g transform="translate(525 330)"><rect width="150" height="42" rx="12" fill="#121335" stroke="#8a5cff"/><text x="75" y="26" fill="#eee8ff" text-anchor="middle">VIRGINIA QUERY</text></g>
    <g transform="translate(740 295)"><rect width="150" height="42" rx="12" fill="#211735" stroke="#ffd15c"/><text x="75" y="26" fill="#fff2bd" text-anchor="middle">HUMAN REVIEW</text></g>
  </g>
  <text x="600" y="402" fill="#71839c" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">Read-only public-data visualization. No SpaceX affiliation, operational-system connection, flight control, telecommand transmission, or vehicle actuation.</text>
</svg>
